<style>
/* VOICE: ruhig, präzise, werkstatttauglich – wie ein guter Ausdruck aus dem Büro

   COLOUR and TYPE: Schiefer-Kopf, Birke, Sägeblatt-Rot, Kanten-Magenta; Barlow Condensed + Barlow

.toast button{min-height:36px;background:transparent;color:var(--wood);border-color:#56636a}

/* ---------- Optimierer (Guillotine) ---------- */
function pack(items,stock,kerf,tr,minT,split,fit,small,one){
 const sheets=[],avail=stock.map(s=>s.q),un=[];
 const order=stock.map((_,i)=>i);if(small)order.sort((a,b)=>stock[a].l*stock[a].b-stock[b].l*stock[b].b);
 const okStrip=d=>minT<=0||d<=kerf||d-kerf>=minT;
 const fits=(F,w,h)=>w<=F.w&&h<=F.h&&okStrip(F.w-w)&&okStrip(F.h-h);
 const score=(F,w,h)=>fit?F.w*F.h-w*h:Math.min(F.w-w,F.h-h);
 const place=(sh,ri,p,w,h,rot)=>{
  const F=sh.free.splice(ri,1)[0];
  sh.pl.push({x:F.x,y:F.y,w,h,p,rot});
  const rw=F.w-w-kerf,bh=F.h-h-kerf;
  let s=split;if(s===2)s=rw<bh?0:1;
  const cw=F.w-w>0,ch=F.h-h>0;
  if(s===0){if(ch){sh.cuts++;sh.cl+=F.w}if(cw){sh.cuts++;sh.cl+=h}}else{if(cw){sh.cuts++;sh.cl+=F.h}if(ch){sh.cuts++;sh.cl+=w}}
  const A=s===0?[{x:F.x+w+kerf,y:F.y,w:rw,h},{x:F.x,y:F.y+h+kerf,w:F.w,h:bh}]
              :[{x:F.x+w+kerf,y:F.y,w:rw,h:F.h},{x:F.x,y:F.y+h+kerf,w,h:bh}];
  for(const r of A)if(r.w>0&&r.h>0)sh.free.push(r);
 };
 const orient=(F,p)=>{const o=[];if(fits(F,p.l,p.b))o.push([p.l,p.b,0]);if(p.r&&p.l!==p.b&&fits(F,p.b,p.l))o.push([p.b,p.l,1]);return o};
 for(const p of items){
  let best=null;
  for(const sh of sheets)sh.free.forEach((F,ri)=>{for(const[w,h,rot]of orient(F,p)){const sc=score(F,w,h);if(!best||sc<best.sc)best={sh,ri,w,h,rot,sc}}});
  if(best){place(best.sh,best.ri,p,best.w,best.h,best.rot);continue}
  let opened=false;
  if(!(one&&sheets.length))for(const si of order){
   if(avail[si]<=0)continue;const S=stock[si],F={x:tr[2],y:tr[0],w:S.l-tr[2]-tr[3],h:S.b-tr[0]-tr[1]};
   if(F.w<=0||F.h<=0)continue;const o=orient(F,p);if(!o.length)continue;
   const n=tr.filter(v=>v>0).length;
   const sh={si,S,free:[F],pl:[],cuts:n,cl:(tr[0]>0)*S.l+(tr[1]>0)*S.l+(tr[2]>0)*S.b+(tr[3]>0)*S.b};sheets.push(sh);avail[si]--;

 if(drag.moved){const a=svgPt(drag.inv,drag.sx,drag.sy),b=svgPt(drag.inv,e.clientX,e.clientY);drag.dx=b.x-a.x;drag.dy=b.y-a.y;drag.gEl.setAttribute('transform',`translate(${drag.dx} ${drag.dy})`);drag.gEl.style.opacity=.8}
});
document.addEventListener('pointerup',()=>{if(!drag)return;const D=drag;drag=null;
 if(!D.moved){res.sel=res.sel&&res.sel.g===D.gi&&res.sel.i===D.pi?null:{g:D.gi,i:D.pi};renderOut();return}
 let dx=D.dx,dy=D.dy;if(view.tr)[dx,dy]=[dy,dx];
 const g=res.G[D.gi],x=g.sh.pl[D.pi],p=snapMove(g.sh,D.pi,x.x+dx,x.y+dy);
 if(!p){renderOut();toast(T('Passt da nicht'));return}
 for(const s of g.list){s.pl[D.pi].x=p[0];s.pl[D.pi].y=p[1]}
 afterEdit('Teil verschoben');
});
document.addEventListener('pointercancel',()=>{if(drag){drag=null;renderOut()}});

function editAct(a,gi){
 if(a==='none'){res.sel=null;renderOut();return}
 const g=res.G[gi],pi=res.sel.i,sh=g.sh,x=sh.pl[pi];
 if(a==='del'){for(const s of g.list){const y=s.pl.splice(pi,1)[0];res.un.push(y.p)}afterEdit('Teil entfernt');return}
 if(a==='rot'){if(!x.p.r){toast(T('Maserung – Drehen nicht erlaubt'));return}
  let pos=valid(sh,pi,x.x,x.y,x.h,x.w)?[x.x,x.y]:findSpot(sh,pi,x.h,x.w);if(!pos){toast(T('Kein freier Platz'));return}
  for(const s of g.list){const y=s.pl[pi];[y.w,y.h]=[y.h,y.w];y.rot=y.rot?0:1;y.x=pos[0];y.y=pos[1]}afterEdit('Teil gedreht')}
}
function insertUn(key){
 const i=res.un.findIndex(p=>p.c+'|'+p.l+'|'+p.b===key);if(i<0)return;const p=res.un[i];
 for(const sh of res.sheets){if(res.set.oMat&&sh.S.n!==p.m)continue;
  for(const[w,h,rot]of p.r&&p.l!==p.b?[[p.l,p.b,0],[p.b,p.l,1]]:[[p.l,p.b,0]]){const pos=findSpot(sh,-1,w,h);
   if(pos){sh.pl.push({x:pos[0],y:pos[1],w,h,p,rot});res.un.splice(i,1);afterEdit('Teil eingesetzt');return}}}
 toast(T('Kein freier Platz'));
}

async function saveData(name,data){
 const note=t=>{const n=$('pnote');if(n)n.textContent=t;toast(t)};
 const dl=(window.claude&&claude.use)?await claude.use('downloads').catch(()=>null):null;
 if(!dl){try{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);note(T('Heruntergeladen')+': '+name)}catch(e){note(T('Download hat nicht geklappt.'))}return}
 try{await dl.save({filename:name,data});note(T('Gespeichert')+': '+name)}
 catch(e){note(T(e&&e.code==='declined'?'Speichern abgebrochen.':e&&e.code==='host_unavailable'?'Diese App kann keine Dateien speichern – öffne die Seite im Browser.':'Speichern hat nicht geklappt, bitte nochmal versuchen.'))}
}

function drawLabel(doc,x,y,F,L){
 const p=Math.min(3,F.h*0.08),k=Math.min(F.h/37,F.w/70);
 const q=qrcode(0,'L');q.addData(qrText(L),'Byte');q.make();
 const hasK=L.kk&&L.kk.some(v=>v),sk=hasK||L.grain;
 const n=q.getModuleCount(),qs=sk?Math.min((F.h-2*p)*0.64,F.w*0.3):Math.min(F.h-2*p,F.w*0.42),m=qs/n,qy=sk?y+p:y+p+(F.h-2*p-qs)/2;
 doc.setFillColor(0,0,0);
 for(let r=0;r<n;r++){let c=0;while(c<n){if(q.isDark(r,c)){let e=c;while(e<n&&q.isDark(r,e))e++;doc.rect(x+p+c*m,qy+r*m,(e-c)*m+0.01,m+0.01,'F');c=e}else c++}}

 if(sk){/* Teil-Skizze unter dem QR: oben/unten = L1/L2, links/rechts = B1/B2, Pfeil = Maserung */
  const bw=qs,bh=y+F.h-p-(qy+qs+1.2),ar=L.fl/L.fb;let sw=bw,sh2=bw/ar;if(sh2>bh){sh2=bh;sw=Math.min(bw,bh*ar)}
  sw=Math.max(sw,bw*0.3);sh2=Math.max(sh2,bh*0.3);const sx=x+p+(bw-sw)/2,sy=qy+qs+1.2+(bh-sh2)/2;
  doc.setDrawColor('#000000');doc.setLineWidth(0.15);doc.setFillColor('#f0f0f0');doc.rect(sx,sy,sw,sh2,'FD');
  const ln=[[sx,sy,sx+sw,sy],[sx,sy+sh2,sx+sw,sy+sh2],[sx,sy,sx,sy+sh2],[sx+sw,sy,sx+sw,sy+sh2]];
  (L.kk||[]).forEach((v,j)=>{if(!v)return;doc.setDrawColor(etCol(v));doc.setLineWidth(Math.max(0.6,Math.min(1.4,bh*0.12)));const[a,b,c,d]=ln[j];doc.line(a,b,c,d)});
  if(ET().length>1){doc.setFont('helvetica','bold');doc.setFontSize(Math.max(4,Math.min(6,bh*1.3)));doc.setTextColor('#000000');const fh=doc.getFontSize()*0.3528;
   (L.kk||[]).forEach((v,j)=>{if(!v)return;const t=String(v),w=doc.getTextWidth(t);const pos=[[sx+sw/2-w/2,sy+fh+0.5],[sx+sw/2-w/2,sy+sh2-0.6],[sx+0.9,sy+sh2/2+fh/2],[sx+sw-0.9-w,sy+sh2/2+fh/2]][j];doc.text(t,pos[0],pos[1])})}

  doc.setDrawColor('#000000');
 }

function parseCSV(txt){
 const lines=txt.replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
 const d=lines[0].includes(';')?';':lines[0].includes('\t')?'\t':',';
 const out=[],f=uf();
 for(const ln of lines){
  const c=[];let cur='',q=false;for(let i=0;i<ln.length;i++){const ch=ln[i];if(q){if(ch==='"'&&ln[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===d){c.push(cur.trim());cur=''}else cur+=ch}c.push(cur.trim());
  let o=0;if(num(c[0])>0&&!/[a-zäöüčćšžđ]/i.test(c[0]))o=-1;
  const n=o<0?'':c[0],a1=num(c[1+o])*f,a2=num(c[2+o])*f;if(!(a1>0&&a2>0))continue;
  const l=cfg.ord==='lb'?a1:a2,b=cfg.ord==='lb'?a2:a1;
  const qv=num(c[3+o])||1,rv=(c[4+o]||'').toLowerCase(),mv=(c[5+o]||'').trim(),kv=(c[6+o]||'').toUpperCase();
  out.push({n,l,b,q:Math.max(1,Math.round(qv)),r:/^(j|ja|y|yes|d|da|1|x|true)/.test(rv)?1:0,m:mv||undefined,k:EN.map(e=>{const mm=kv.match(new RegExp(e+'(?:[:=](\\d))?'));return mm?Math.min(Math.max(1,+(mm[1]||1)),Math.max(1,ET().length)):0})});
 }
 return out;
}
const PK=KEY+'-projekte';
const localP=()=>{try{return JSON.parse(localStorage.getItem(PK))||{}}catch(e){return{}}};
const projs=()=>cloud||localP();
function drawUser(){const w=$('who');if(!w)return;
 w.innerHTML=user?`<span>☁ ${esc(user.email)}</span><button id="logout">${esc(T('Abmelden'))}</button>`:window.sb?`<a href="login.html">${esc(T('Anmelden'))}</a>`:''}
async function loadCloud(){
 const{data,error}=await sb.from('projects').select('name,data').order('name');
 if(error){toast(T('Cloud nicht erreichbar'));return}
 cloud={};for(const r of data)cloud[r.name]=r.data;
 const L=localP(),up=Object.keys(L).filter(n=>!(n in cloud)).map(n=>({name:n,data:L[n]}));
 if(up.length){const{error:e2}=await sb.from('projects').upsert(up,{onConflict:'user_id,name'});if(!e2){up.forEach(r=>cloud[r.name]=r.data);toast(T('{n} lokale Projekte in die Cloud übernommen',{n:up.length}))}}
 drawProj();
}
function drawProj(){const P=projs(),ks=Object.keys(P).sort((a,b)=>a.localeCompare(b,'de'));
 $('proj').innerHTML=`<option value="">${esc(ks.length?T('– gespeicherte Projekte ({n}) –',{n:ks.length}):T('– noch keine Projekte gespeichert –'))}</option>`+ks.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('')}
function loadState(o){if(!o||!Array.isArray(o.parts)||!Array.isArray(o.stock))return false;snap();st=JSON.parse(JSON.stringify(o));fix();renderAll();save();return true}
function toast(msg,undo){
 $('tmsg').textContent=msg;$('undo').style.display=undo?'':'none';$('toast').style.display='flex';
 clearTimeout(tm);tm=setTimeout(()=>$('toast').style.display='none',4000);
}
let deb,tmM;const refresh=()=>{save();clearTimeout(deb);deb=setTimeout(updStale,120)};
const snap=()=>{last=JSON.stringify(st)};

/* ---------- Ereignisse ---------- */
document.addEventListener('input',e=>{
 const t=e.target,k=t.dataset.k,val=t.dataset.u&&t.value!==''?num(t.value)*uf():t.value;
 if(k){const o=st[k][+t.dataset.i];if(!o)return;const f=t.dataset.f;o[f]=f==='r'?(t.checked?1:0):val;refresh();if((k==='stock'&&f==='n')||k==='etypes'){clearTimeout(tmM);tmM=setTimeout(()=>{$('parts').innerHTML=partsHTML()},k==='etypes'?150:600)}}
 else if(t.id==='kerf'||t.id==='kerf2'){st.kerf=val;const o2=$(t.id==='kerf'?'kerf2':'kerf');if(o2)o2.value=t.value;refresh()}
 else if(t.id==='trim'){st.trim=val;refresh()}
 else if(t.dataset.opt){const k=t.dataset.opt;st[k]=t.checked?1:0;if(k==='oLab'){save();renderOut();return}if(k==='oEdge')$('ecard').hidden=!st.oEdge;if(k!=='oOne')$('parts').innerHTML=partsHTML();refresh()}
 else if(t.id==='job'){st.job=t.value;save()}
 else if(t.id==='sub'){st.sub=t.checked?1:0;refresh()}
 else if(t.dataset.o){st[t.dataset.o]=val;refresh()}
 else if(t.dataset.c){const c=t.dataset.c;cfg[c]=t.value;saveCfg();if(c==='lang'||c==='unit'||c==='ord'){const x=document.querySelector('.nin')?.scrollLeft||0;renderAll();const n=document.querySelector('.nin');if(n)n.scrollLeft=x;document.querySelector(`[data-c="${c}"]`)?.focus()}else renderOut()}
 else if(t.dataset.on!==undefined){const p=st.parts[+t.dataset.on];p.off=t.checked?0:1;t.closest('.prt').classList.toggle('off',!!p.off);refresh()}
 else if(t.id==='bE'||t.id==='bN'||t.id==='bM'){const v=t.value;if(!v)return;snap();st.parts.forEach((p,i)=>{if(t.id==='bE')p.k=v==='all'?[1,1,1,1]:v==='long'?[1,1,0,0]:v==='short'?[0,0,1,1]:[0,0,0,0];else if(t.id==='bM')p.m=v;else p.n=v==='dim'?`${fmt(num(p.l))}×${fmt(num(p.b))}`:v==='num'?String(i+1):''});t.value='';drawInputs();refresh();toast(T('Für alle Teile')+' ✓',1)}
 else if(t.id==='fmt'){fmtSel=+t.value;try{localStorage.setItem(KEY+'f',fmtSel)}catch(er){}}
});
document.addEventListener('change',e=>{
 if(e.target.id!=='pfile')return;const f=e.target.files[0];e.target.value='';if(!f)return;
 f.text().then(txt=>{
  if(/\.json$/i.test(f.name)||txt.trim().startsWith('{')){let o;try{o=JSON.parse(txt)}catch(er){}if(loadState(o))toast(T('Projekt geöffnet')+': '+f.name,1);else toast(T('Datei ist kein Projekt'))}
  else{const ps=parseCSV(txt);if(!ps.length){toast(T('Keine Teile erkannt'));return}snap();st.parts.push(...ps);drawInputs();refresh();toast(T('{n} Teile übernommen',{n:ps.length}),1)}
 });
});
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.id==='run'||t.id==='stl'){compute();return}
 if(t.dataset.swp!==undefined){const p=st.parts[+t.dataset.swp];[p.l,p.b]=[p.b,p.l];p.k=[p.k[2],p.k[3],p.k[0],p.k[1]];drawInputs();refresh();return}
 if(t.id==='onAll'||t.id==='offAll'){st.parts.forEach(p=>p.off=t.id==='offAll'?1:0);drawInputs();refresh();return}
 if(t.dataset.v){const v=t.dataset.v;if(v==='edit'){view.edit=view.edit?0:1;if(res)res.sel=null}else if(v==='zi')view.z=Math.min(4,+(view.z*1.25).toFixed(3));else if(v==='zo')view.z=Math.max(0.5,+(view.z/1.25).toFixed(3));else if(v==='zr')view.z=1;else if(v==='fi')view.f=Math.min(2.4,view.f*1.15);else if(v==='fo')view.f=Math.max(0.5,view.f/1.15);else view[v]=view[v]?0:1;saveView();renderOut();return}
 if(t.dataset.tab!==undefined){ovTab=+t.dataset.tab;renderOut();return}
 if(t.dataset.inf!==undefined){const x=t.nextElementSibling;if(x)x.hidden=!x.hidden;return}
 if(t.dataset.ea){editAct(t.dataset.ea,+t.dataset.g);return}
 if(t.dataset.ins!==undefined){insertUn(t.dataset.ins);return}
 if(t.id==='gstart'){gdOpen();return}
 if(t.id==='gx'){gdClose();return}
 if(t.id==='gp'||t.id==='gn'||t.id==='gr'){if(t.id==='gr')gd.i=0;else if(t.id==='gp')gd.i=Math.max(0,gd.i-1);else if(gd.i>=gd.steps.length-1){gdClose();gd=null;toast(T('Alle Schnitte erledigt.'));return}else gd.i++;gdDraw();return}
 if(t.id==='lists'){if(libsOk())makeListPDF();return}
 if(t.dataset.ts!==undefined){const j=+t.dataset.ts;st.ts[j]=st.ts[j]?0:1;t.setAttribute('aria-pressed',st.ts[j]?'true':'false');refresh()}
 else if(t.dataset.edge!==undefined){const p=st.parts[+t.dataset.edge],j=+t.dataset.j,n=ET().length||1;p.k[j]=(p.k[j]+1)%(n+1);t.setAttribute('aria-pressed',p.k[j]?'true':'false');
  t.style.setProperty('--ec',etCol(p.k[j]));t.title=EN[j]+(p.k[j]?': '+etName(p.k[j]):'');t.parentNode.querySelector('small').textContent=p.k.some(v=>v)?T('Kante'):'';refresh()}
 else if(t.dataset.dele!==undefined){snap();const i=+t.dataset.dele,tt=i+1;st.etypes.splice(i,1);st.parts.forEach(p=>p.k=p.k.map(v=>v===tt?0:v>tt?v-1:v));drawInputs();refresh();toast(T('Zeile gelöscht'),1)}
 else if(t.id==='addE'){const cols=['#1f6feb','#e11d48','#16a34a','#f59e0b','#7c3aed','#0891b2','#e6007e','#111827'];st.etypes.push({n:'',d:1,c:cols[st.etypes.length%cols.length]});drawInputs();refresh()}
 else if(t.dataset.del){snap();st[t.dataset.del].splice(+t.dataset.i,1);drawInputs();refresh();toast(T('Zeile gelöscht'),1)}
 else if(t.dataset.dup!==undefined){const i=+t.dataset.dup;st.parts.splice(i+1,0,JSON.parse(JSON.stringify(st.parts[i])));drawInputs();refresh();toast(T('Teil kopiert'))}
 else if(t.id==='addP'){const p=st.parts[st.parts.length-1];st.parts.push({n:'',l:'',b:'',q:1,r:p?p.r:1,k:[0,0,0,0],m:p?p.m:undefined});drawInputs();refresh();
  const ins=$('parts').querySelectorAll('.nm');ins[ins.length-1]?.focus()}
 else if(t.id==='addS'){st.stock.push({n:'',l:2800,b:2070,q:10,p:''});drawInputs();refresh()}
 else if(t.id==='clr'){snap();st.parts=[];drawInputs();refresh();toast(T('Liste geleert'),1)}
 else if(t.id==='demo'){snap();st=demo();renderAll();save();toast(T('Beispiel geladen'),1)}
 else if(t.id==='undo'&&last){st=JSON.parse(last);last=null;fix();renderAll();save();$('toast').style.display='none'}
 else if(t.id==='rAll'||t.id==='rNone'){snap();st.parts.forEach(p=>p.r=t.id==='rAll'?1:0);drawInputs();refresh();toast(T(t.id==='rAll'?'Alle Teile dürfen gedreht werden':'Kein Teil wird gedreht'),1)}
 else if(t.id==='plan'){if(libsOk())makePlanPDF()}
 else if(t.id==='pdf'){if(libsOk())makeLabelPDF()}
 else if(t.id==='prt'){try{window.print()}catch(er){}}
 else if(t.id==='csvout'){saveData(fname('Schnittliste','csv'),cutCSV())}
 else if(t.id==='copy'){const txt=cutText();
  const fb=()=>{const a=document.createElement('textarea');a.value=txt;a.style.cssText='width:100%;height:220px;margin-top:10px';t.closest('.card').appendChild(a);a.select();toast(T('Text markiert – jetzt kopieren'))};
  try{navigator.clipboard.writeText(txt).then(()=>toast(T('Schnittliste kopiert')),fb)}catch(er){fb()}}
 else if(t.id==='csvadd'||t.id==='csvrep'){const ps=parseCSV($('csv').value);if(!ps.length){toast(T('Keine Teile erkannt'));return}
  snap();if(t.id==='csvrep')st.parts=[];st.parts.push(...ps);$('csv').value='';drawInputs();refresh();toast(T('{n} Teile übernommen',{n:ps.length}),1)}
 else if(t.id==='logout'){sb.auth.signOut().then(()=>location.replace('index.html'))}
 else if(t.id==='psave'&&cloud){const n=(st.job||'').trim()||('Projekt '+new Date().toLocaleString(loc()));const data=JSON.parse(JSON.stringify(st));
  sb.from('projects').upsert({name:n,data,updated_at:new Date().toISOString()},{onConflict:'user_id,name'}).then(({error})=>{if(error){toast(T('Speichern hat nicht geklappt, bitte nochmal versuchen.'));return}cloud[n]=data;drawProj();$('proj').value=n;toast('☁ '+T('Gespeichert')+': '+n)})}
 else if(t.id==='pdel'&&cloud){const n=$('proj').value;if(!n){toast(T('Erst ein Projekt auswählen'));return}
  sb.from('projects').delete().eq('name',n).then(({error})=>{if(error){toast(T('Cloud nicht erreichbar'));return}delete cloud[n];drawProj();toast(T('Gelöscht')+': '+n)})}
 else if(t.id==='psave'){const n=(st.job||'').trim()||('Projekt '+new Date().toLocaleString(loc()));const P=projs();P[n]=st;
  try{localStorage.setItem(PK,JSON.stringify(P));drawProj();$('proj').value=n;toast(T('Gespeichert')+': '+n)}catch(er){toast(T('Speichern im Browser nicht möglich'))}}
 else if(t.id==='pload'){const n=$('proj').value;if(!n){toast(T('Erst ein Projekt auswählen'));return}if(loadState(projs()[n])){$('proj').value=n;toast(T('Geladen')+': '+n,1)}}
 else if(t.id==='pdel'){const n=$('proj').value;if(!n){toast(T('Erst ein Projekt auswählen'));return}const P=projs();delete P[n];try{localStorage.setItem(PK,JSON.stringify(P))}catch(er){}drawProj();toast(T('Gelöscht')+': '+n)}
 else if(t.id==='pjson'){saveData(fname('Projekt','json'),JSON.stringify(st,null,1))}
 else if(t.id==='r2s'){snap();let n=0;res.sheets.forEach(sh=>sh.rests.forEach(r=>{st.stock.unshift({n:sh.S.n,l:Math.round(r.w),b:Math.round(r.h),q:1,p:''});n++}));drawInputs();refresh();toast(T('{n} Reste im Lager – für den neuen Auftrag „Liste leeren“',{n}),1)}
});
compute(true);renderAll();
(async()=>{
 const show=()=>document.getElementById('authhide')?.remove();
 if(!window.sb){show();return}
 let s=null;try{s=(await sb.auth.getSession()).data.session}catch(e){show();return}
 if(!s){location.replace('login.html');return}
 user=s.user;show();drawUser();loadCloud();
 sb.auth.onAuthStateChange((ev,ss)=>{if(ev==='SIGNED_OUT')location.replace('login.html')});
})();
}
