   IDEA: der Schnittplan auf Papier, der an der Formatkreissäge hängt, mit Maßketten
   PICTURE: weiße Planblätter mit Birkenteilen, schraffiertem Rest und Magenta-Kanten
   COLOUR and TYPE: Schiefer-Kopf, Birke, Sägeblatt-Rot, Kanten-Magenta; Barlow Condensed + Barlow
   LAYOUT: Eingabe links, Pläne rechts, Kennzahlen im Kopf; auf dem Handy untereinander */
:root{color-scheme:light dark;
--bg:light-dark(#eef0ef,#101416);--card:light-dark(#ffffff,#1a2023);--ink:light-dark(#1b2125,#ecebe6);--mut:light-dark(#5f686e,#9aa4aa);
--line:light-dark(#e1e5e6,#2b3438);--field:light-dark(#f4f6f6,#232b2f);--sh:light-dark(0 1px 2px #0000000d,0 1px 3px #0006);
--slate:#1f282d;--wood:#e9c98f;--red:#d6402b;--edge:#e6007e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05;margin:0}
h1{font-size:clamp(32px,4.6vw,48px);text-wrap:balance}
h2{font-size:22px;margin-bottom:12px}
header{background:var(--slate);color:#f2efe8;padding:22px max(4vw,16px) 22px;border-bottom:6px solid var(--wood);box-shadow:inset 0 -6px 0 #c9a362}
.hin{max-width:1500px;margin:auto;display:flex;flex-wrap:wrap;gap:18px 40px;align-items:flex-end;justify-content:space-between}
.ht{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
header p{margin:6px 0 0;color:#b9c2c6;max-width:56ch}
.gear{display:inline-flex;align-items:center;gap:8px;background:#ffffff14;border-color:#ffffff30;color:#fff}
.gear:hover{background:#ffffff24;border-color:#ffffff60}
.gear svg{width:20px;height:20px}
.credit{display:inline-block;margin-top:8px;font-size:13px;color:#9fabb1;letter-spacing:.01em}.credit b{color:var(--wood);font-weight:600}
.nav{position:sticky;top:0;z-index:15;background:#151c20;border-bottom:1px solid #ffffff1f;box-shadow:0 2px 10px #0003}
.nin{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;overflow-x:auto;padding:8px max(4vw,16px) 10px;max-width:1500px;margin:auto;scrollbar-width:thin}
.ni{flex:none;display:flex;flex-direction:column;gap:2px}
.ni>span{font-size:11px;color:#9fabb1;white-space:nowrap}
.nav select,.nav input[type=number]{width:auto;min-height:38px;padding:4px 8px;font-size:15px;background:#232d33;color:#f2efe8;border-color:#ffffff26;border-radius:7px}
.nav input[type=number]{width:72px}
@media(max-width:700px){.nin{flex-wrap:nowrap}.nav{position:static}}
.nav .row{display:flex;gap:6px;align-items:center;color:#9fabb1;font-size:13px}
.nav .kw{width:70px;height:40px}.nav .kw.tr:before{inset:7px 9px;background:#3a454b}
.nav .kw .t,.nav .kw .b{height:13px}.nav .kw .l,.nav .kw .r{top:10px;bottom:10px;width:18px}
.nav .kw .t:after{left:9px;right:9px;top:5px;height:3px}.nav .kw .b:after{left:9px;right:9px;bottom:5px;height:3px}
.nav .kw .l:after{top:-3px;bottom:-3px;left:8px;width:3px}.nav .kw .r:after{top:-3px;bottom:-3px;right:8px;width:3px}
.nav .kw button:after{background:#56636a}.nav .kw small{display:none}
.kpi{display:flex;flex-wrap:wrap;gap:10px 28px}
.kpi div{display:flex;flex-direction:column}
.kpi .big{font-size:clamp(28px,3.6vw,40px);font-variant-numeric:tabular-nums;white-space:nowrap;color:#fff}
.kpi span{font-size:13px;color:#9fabb1}
.kpi .wa .big{color:var(--wood)}
.wrap{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:22px;padding:22px max(4vw,16px) 56px;max-width:1500px;margin:auto}
@media(max-width:960px){.wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:var(--sh);border:1px solid light-dark(transparent,var(--line))}
.prt{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:light-dark(#fcfcfb,#1e2528)}
.r1{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;margin-bottom:8px}
.r1.p{grid-template-columns:minmax(0,1fr) 52px 44px}
.r2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 60px 52px 96px;gap:8px;align-items:end}
.r2.s{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 60px 76px}
.r3{margin-top:8px}
@media(max-width:600px){.r2.s{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 60px}.r2.s .f:last-child{grid-column:1/3}.r2{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 60px}.r2 .rot{grid-column:1}.r2 .kw{grid-column:2/4;justify-self:start}}
.f span{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input[type=number],input[type=text],select{width:100%;font:16px Barlow,sans-serif;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);min-height:44px}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.nm{font-weight:600}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.rot{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mut);cursor:pointer;min-height:56px}
.rot input{width:22px;height:22px;margin:0 0 3px;accent-color:var(--red)}
.kw{position:relative;width:96px;height:56px;flex:none}
.kw:before{content:"";position:absolute;inset:9px 12px;background:var(--wood);border-radius:2px;opacity:.9}
.kw.tr:before{background:light-dark(#d5dbde,#3a454b)}
.kw button{position:absolute;padding:0;border:0;background:transparent;min-height:0;border-radius:4px}
.kw button:after{content:"";position:absolute;background:light-dark(#c8ced1,#4a555b)}
.kw .t,.kw .b{left:0;right:0;height:18px}.kw .t{top:0}.kw .b{bottom:0}
.kw .l,.kw .r{top:14px;bottom:14px;width:24px}.kw .l{left:0}.kw .r{right:0}
.kw .t:after{left:12px;right:12px;top:7px;height:3px}.kw .b:after{left:12px;right:12px;bottom:7px;height:3px}
.kw .l:after{top:-5px;bottom:-5px;left:10px;width:3px}.kw .r:after{top:-5px;bottom:-5px;right:10px;width:3px}
.kw button[aria-pressed=true]:after{background:repeating-linear-gradient(90deg,var(--ec,var(--edge)) 0 6px,transparent 6px 10px)}
.kw .l[aria-pressed=true]:after,.kw .r[aria-pressed=true]:after{background:repeating-linear-gradient(180deg,var(--ec,var(--edge)) 0 6px,transparent 6px 10px)}
.r2.e{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:4px;cursor:pointer}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;min-height:44px;cursor:pointer}.chk input{width:22px;height:22px;accent-color:var(--red)}
.legs{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}
.kw.tr button[aria-pressed=true]:after{background:var(--red)}
.kw small{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#5a4320;pointer-events:none;font-weight:600}
.kw.tr small{color:var(--mut);display:grid;margin:0;font-size:11px}
button{font:600 15px Barlow,sans-serif;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);min-height:44px;padding:0 16px;cursor:pointer}
button:hover{border-color:var(--mut)}
.del,.dup{padding:0;color:var(--mut);background:transparent}.del{font-size:22px}.dup{font-size:13px}
.del:hover{color:var(--red)}
.pri{background:var(--red);border-color:var(--red);color:#fff}
.pri:hover{filter:brightness(1.08);border-color:var(--red)}
.fbtn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:var(--field);font-weight:600;font-size:15px;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.set{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.set .w2{grid-column:1/-1}
.note{font-size:14px;color:var(--mut);margin:10px 0 0}
details{margin-top:12px}summary{cursor:pointer;font-weight:600;min-height:32px}
textarea{width:100%;min-height:120px;font:14px/1.4 ui-monospace,monospace;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
.leg{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--mut)}
.leg i{display:inline-block;width:26px;height:3px;background:repeating-linear-gradient(90deg,var(--ec,var(--edge)) 0 6px,transparent 6px 10px)}
.warn{background:light-dark(#fde8e4,#3a1d18);border:1px solid var(--red);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts select{width:auto;flex:1 1 220px}
.sheet .sh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline;margin-bottom:12px}
.sheet .sh .big{font-size:26px}.sheet .sh span{color:var(--mut);font-size:14px}.sheet .sh .stk{color:#fff;font-size:15px}
.stk{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:1px 8px;font-size:15px;font-family:Barlow,sans-serif;vertical-align:middle;margin-left:6px}
.pw{overflow-x:auto;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px light-dark(#e6e9ea,#000)}
.pw svg{display:block;width:100%;height:auto}
@media(max-width:600px){.pw svg{min-width:620px}}
.cl{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.cl td,.cl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cl th{font-weight:600;color:var(--mut);font-size:13px}
.cl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cl small,.rest td{color:var(--mut)}
.ovl{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:20;padding:16px}
.dlg{background:var(--card);color:var(--ink);border-radius:16px;width:min(580px,100%);max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 20px 60px #0006}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.dh h2{margin:0;font-size:28px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.srow b{font-weight:600;font-size:16px}.srow small{display:block;color:var(--mut);font-size:13px;line-height:1.35;margin-top:2px}
.srow .ctl{display:flex;gap:10px;align-items:center}
@media(max-width:480px){.srow{grid-template-columns:minmax(0,1fr)}}
.df{display:flex;justify-content:flex-end;padding:14px 20px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--slate);color:#fff;padding:10px 16px;border-radius:10px;display:none;gap:12px;align-items:center;z-index:30;box-shadow:0 6px 20px #0004;max-width:calc(100vw - 24px)}
.toast button{min-height:36px;background:transparent;color:var(--wood);border-color:#56636a}
@media(prefers-reduced-motion:no-preference){.sheet{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
@media(max-width:600px){.cl{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 0;padding-inline-start:6.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6em;margin-inline-start:-6.5em;color:var(--mut)}.stack td:empty{display:none}}
@page{size:A4 landscape;margin:10mm}
@media print{body{background:#fff;color:#000}header{padding:8px 0;background:#fff;color:#000;border:0;box-shadow:none}header p,.credit,.nav,.inp,.acts-card,.toast{display:none!important}.kpi .big,.kpi .wa .big{color:#000}.kpi span{color:#444}.wrap{display:block;padding:0}.card{box-shadow:none;border:0;padding:0}.sheet{break-after:page;animation:none}.pw svg{min-width:0}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

 ${it('Schnittrichtung','Längs = zuerst durchgehende Streifen über die Plattenlänge, quer = über die Breite.',`<select data-o="first">${opt('auto',st.first,T('Optimal'))}${opt('laengs',st.first,T('Längs'))}${opt('quer',st.first,T('Quer'))}</select>`)}

 </div></nav>`;

 if(e.target.id!=='pfile')return;const f=e.target.files[0];e.target.value='';if(!f)return;
 f.text().then(txt=>{
  if(/\.json$/i.test(f.name)||txt.trim().startsWith('{')){let o;try{o=JSON.parse(txt)}catch(er){}if(loadState(o))toast(T('Projekt geöffnet')+': '+f.name,1);else toast(T('Datei ist kein Projekt'))}
  else{const ps=parseCSV(txt);if(!ps.length){toast(T('Keine Teile erkannt'));return}snap();st.parts.push(...ps);drawInputs();refresh();toast(T('{n} Teile übernommen',{n:ps.length}),1)}
 });
});
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.ts!==undefined){const j=+t.dataset.ts;st.ts[j]=st.ts[j]?0:1;t.setAttribute('aria-pressed',st.ts[j]?'true':'false');refresh()}
 else if(t.dataset.edge!==undefined){const p=st.parts[+t.dataset.edge],j=+t.dataset.j,n=ET().length||1;p.k[j]=(p.k[j]+1)%(n+1);t.setAttribute('aria-pressed',p.k[j]?'true':'false');
  t.style.setProperty('--ec',etCol(p.k[j]));t.title=EN[j]+(p.k[j]?': '+etName(p.k[j]):'');t.parentNode.querySelector('small').textContent=p.k.some(v=>v)?T('Kante'):'';refresh()}
 else if(t.dataset.dele!==undefined){snap();const i=+t.dataset.dele,tt=i+1;st.etypes.splice(i,1);st.parts.forEach(p=>p.k=p.k.map(v=>v===tt?0:v>tt?v-1:v));drawInputs();refresh();toast(T('Zeile gelöscht'),1)}
 else if(t.id==='addE'){const cols=['#1f6feb','#e11d48','#16a34a','#f59e0b','#7c3aed','#0891b2','#e6007e','#111827'];st.etypes.push({n:'',d:1,c:cols[st.etypes.length%cols.length]});drawInputs();refresh()}
 else if(t.dataset.del){snap();st[t.dataset.del].splice(+t.dataset.i,1);drawInputs();refresh();toast(T('Zeile gelöscht'),1)}
 else if(t.dataset.dup!==undefined){const i=+t.dataset.dup;st.parts.splice(i+1,0,JSON.parse(JSON.stringify(st.parts[i])));drawInputs();refresh();toast(T('Teil kopiert'))}
 else if(t.id==='addP'){const p=st.parts[st.parts.length-1];st.parts.push({n:'',l:'',b:'',q:1,r:p?p.r:1,k:[0,0,0,0],m:p?p.m:undefined});drawInputs();refresh();
  const ins=$('parts').querySelectorAll('.nm');ins[ins.length-1]?.focus()}
 else if(t.id==='addS'){st.stock.push({n:'',l:2800,b:2070,q:10,p:''});drawInputs();refresh()}
 else if(t.id==='clr'){snap();st.parts=[];drawInputs();refresh();toast(T('Liste geleert'),1)}
 else if(t.id==='demo'){snap();st=demo();renderAll();save();toast(T('Beispiel geladen'),1)}
 else if(t.id==='undo'&&last){st=JSON.parse(last);last=null;fix();renderAll();save();$('toast').style.display='none'}
 else if(t.id==='rAll'||t.id==='rNone'){snap();st.parts.forEach(p=>p.r=t.id==='rAll'?1:0);drawInputs();refresh();toast(T(t.id==='rAll'?'Alle Teile dürfen gedreht werden':'Kein Teil wird gedreht'),1)}
 else if(t.id==='plan'){if(libsOk())makePlanPDF()}
 else if(t.id==='pdf'){if(libsOk())makeLabelPDF()}
 else if(t.id==='prt'){try{window.print()}catch(er){}}
 else if(t.id==='csvout'){saveData(fname('Schnittliste','csv'),cutCSV())}
 else if(t.id==='copy'){const txt=cutText();
  const fb=()=>{const a=document.createElement('textarea');a.value=txt;a.style.cssText='width:100%;height:220px;margin-top:10px';t.closest('.card').appendChild(a);a.select();toast(T('Text markiert – jetzt kopieren'))};
  try{navigator.clipboard.writeText(txt).then(()=>toast(T('Schnittliste kopiert')),fb)}catch(er){fb()}}
 else if(t.id==='csvadd'||t.id==='csvrep'){const ps=parseCSV($('csv').value);if(!ps.length){toast(T('Keine Teile erkannt'));return}
  snap();if(t.id==='csvrep')st.parts=[];st.parts.push(...ps);$('csv').value='';drawInputs();refresh();toast(T('{n} Teile übernommen',{n:ps.length}),1)}
 else if(t.id==='psave'){const n=(st.job||'').trim()||('Projekt '+new Date().toLocaleString(loc()));const P=projs();P[n]=st;
  try{localStorage.setItem(PK,JSON.stringify(P));drawProj();$('proj').value=n;toast(T('Gespeichert')+': '+n)}catch(er){toast(T('Speichern im Browser nicht möglich'))}}
 else if(t.id==='pload'){const n=$('proj').value;if(!n){toast(T('Erst ein Projekt auswählen'));return}if(loadState(projs()[n])){$('proj').value=n;toast(T('Geladen')+': '+n,1)}}
 else if(t.id==='pdel'){const n=$('proj').value;if(!n){toast(T('Erst ein Projekt auswählen'));return}const P=projs();delete P[n];try{localStorage.setItem(PK,JSON.stringify(P))}catch(er){}drawProj();toast(T('Gelöscht')+': '+n)}
 else if(t.id==='pjson'){saveData(fname('Projekt','json'),JSON.stringify(st,null,1))}
 else if(t.id==='r2s'){snap();let n=0;res.sheets.forEach(sh=>sh.rests.forEach(r=>{st.stock.unshift({n:sh.S.n,l:Math.round(r.w),b:Math.round(r.h),q:1,p:''});n++}));drawInputs();refresh();toast(T('{n} Reste im Lager – für den neuen Auftrag „Liste leeren“',{n}),1)}
});
renderAll();
}
</script>
</body>
</html>
