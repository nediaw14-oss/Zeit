<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anmelden – SchnittWundeR</title>
<link rel="stylesheet" href="fonts.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b1f3a">
<style>
:root{--slate:#0b1f3a;--acc:#1d4ed8;--accD:#1e40af;--accL:#93b4f5;--red:#c2410c;--ink:#0f172a;--mut:#556274;--line:#e3e8ef;--field:#f4f6f6}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--slate);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;
 background-image:radial-gradient(60% 50% at 50% 0,#17335c 0,transparent 70%)}
h1,h2{font-family:Inter,sans-serif;font-weight:700;line-height:1.2;letter-spacing:-.02em;margin:0}
.box{width:min(420px,100%)}
.logo{display:flex;align-items:center;gap:10px;font:700 20px Inter,sans-serif;letter-spacing:-.01em;text-decoration:none;color:#fff;margin:0 0 18px}
.logo i{width:24px;height:18px;border:2px solid #fff;border-radius:3px;position:relative}.logo em{font-style:normal;font-weight:500;color:#c7d3e6}.logo sup{font-size:.55em;font-weight:600;margin-left:1px}
.logo i:after{content:"";position:absolute;left:8px;top:-2px;bottom:-2px;border-left:2px solid var(--accL)}
.card{background:#fff;border-radius:10px;padding:28px;box-shadow:0 20px 50px #0005;border-top:3px solid var(--acc)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:10px;padding:4px;gap:4px;margin-bottom:18px}
.tabs button{border:0;background:transparent;min-height:42px;border-radius:8px;font:600 16px Inter,sans-serif;color:var(--mut);cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
h2{font-size:24px;margin-bottom:4px}.sub{color:var(--mut);margin:0 0 16px}
label{display:block;margin-bottom:12px}label span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input{width:100%;font:16px Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);min-height:48px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{width:100%;min-height:48px;border:0;border-radius:6px;background:var(--acc);color:#fff;font:600 17px Inter,sans-serif;cursor:pointer;margin-top:4px}
.pri:hover{background:var(--accD)}.pri:disabled{opacity:.6;cursor:wait}
.lnk{background:none;border:0;padding:6px 0;color:var(--mut);font:500 15px Inter,sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.msg{border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:15px}
.msg.err{background:#fde8e4;border:1px solid var(--red);color:#7a1d10}.msg.ok{background:#eaf5ea;border:1px solid #2e7d32;color:#1b4d1e}
.back{display:inline-block;margin-top:16px;color:#b9c2c6;font-size:14px}
.legal{margin:10px 0 0;font-size:13px;color:#8d989d}.legal a{color:#b9c2c6}
label.ok{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;margin:4px 0 14px;cursor:pointer}label.ok input{margin-top:3px;flex:none;width:16px;height:16px}label.ok a{color:inherit}
[hidden]{display:none!important}
fieldset.xp{border:0;padding:0;margin:4px 0 14px}
fieldset.xp legend{font-size:15px;font-weight:600;color:var(--ink);padding:0;margin-bottom:8px}
.xpo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xpo label{margin:0;cursor:pointer}
.xpo input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.xpo span{display:flex;flex-direction:column;gap:2px;min-height:72px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);font:600 15px Inter,sans-serif;color:var(--ink);margin:0}
.xpo small{font-weight:400;font-size:13px;color:var(--mut)}
.xpo input:checked+span{border-color:var(--acc);background:#e6edfc;box-shadow:inset 0 0 0 1px var(--acc)}
.xpo input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:360px){.xpo{grid-template-columns:1fr}}
/* WhatsApp-Kontakt */
.wa{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 16px;border-radius:28px;background:#25d366;color:#fff;font:600 16px Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px #0005;transition:transform .15s,box-shadow .15s}
.wa:hover{transform:translateY(-2px);box-shadow:0 12px 28px #0006}
.wa:focus-visible{outline:2px solid #fff;outline-offset:3px}
.wa svg{width:28px;height:28px;flex:none}
@media(max-width:600px){.wa{width:58px;height:58px;padding:0;justify-content:center}.wa span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>if('serviceWorker'in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</head>
<body>
<main class="box">
 <a class="logo" href="./"><i></i><span>Schnitt<em>WundeR</em></span></a>
 <div class="card">
  <div class="tabs" role="tablist" id="tabs"><button role="tab" data-m="in" aria-selected="true">Anmelden</button><button role="tab" data-m="up" aria-selected="false">Registrieren</button></div>
  <div id="msg" class="msg" hidden role="status"></div>
  <form id="f" novalidate>
   <h2 id="ttl">Willkommen zurück</h2><p class="sub" id="sub">Melde dich an, um deine Projekte zu öffnen.</p>
   <label id="le"><span>E-Mail</span><input type="email" id="em" autocomplete="email" required></label>
   <label id="lp"><span id="lpt">Passwort</span><input type="password" id="pw" autocomplete="current-password" minlength="6" required></label>
   <fieldset class="xp" id="xp" hidden><legend>Kennst du dich mit Zuschnitt-Tools schon aus?</legend>
    <div class="xpo">
     <label><input type="radio" name="xp" value="kenner"><span>Ja, kenne ich<small>Direkt loslegen</small></span></label>
     <label><input type="radio" name="xp" value="neu"><span>Nein, zeig’s mir<small>Kurze Tour in 5 Schritten</small></span></label>
    </div></fieldset>
   <label class="ok" id="dsl" hidden><input type="checkbox" id="ds"><span>Ich habe die <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a> gelesen und bin einverstanden, dass meine E-Mail und meine Projekte zum Speichern verarbeitet werden.</span></label>
   <button class="pri" id="go" type="submit">Anmelden</button>
   <div class="row"><button type="button" class="lnk" id="fg">Passwort vergessen?</button><a class="lnk" href="app.html" id="off" hidden>Ohne Konto weiter</a></div>
  </form>
 </div>
 <a class="back" href="./">← zurück zur Startseite</a>
 <p class="legal"><a href="app.html?demo=1">Ohne Konto ausprobieren</a> · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supa.js"></script>
<script>
{
const $=id=>document.getElementById(id);
let mode='in';
const TX={in:['Willkommen zurück','Melde dich an, um deine Projekte zu öffnen.','Anmelden','current-password'],
 up:['Konto anlegen','Bis 31.01.2027 kostenlos, danach kostenpflichtig. Deine Projekte werden in der Cloud gespeichert.','Registrieren','new-password'],
 fg:['Passwort vergessen','Wir schicken dir einen Link, mit dem du ein neues Passwort setzt.','Link senden',''],
 np:['Neues Passwort','Gib dein neues Passwort ein.','Passwort speichern','new-password']};
const msg=(t,ok)=>{const m=$('msg');m.hidden=!t;m.textContent=t||'';m.className='msg '+(ok?'ok':'err')};
function setMode(m){mode=m;const[a,b,c,ac]=TX[m];$('ttl').textContent=a;$('sub').textContent=b;$('go').textContent=c;
 $('le').hidden=m==='np';$('lp').hidden=m==='fg';$('pw').autocomplete=ac;$('lpt').textContent=m==='np'?'Neues Passwort (mind. 6 Zeichen)':m==='up'?'Passwort (mind. 6 Zeichen)':'Passwort';
 $('fg').hidden=m!=='in';$('tabs').hidden=m==='np';$('xp').hidden=m!=='up';$('dsl').hidden=m!=='up';
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.m===m||(m==='fg'&&b.dataset.m==='in'))));msg('')}
const de=e=>{const s=(e&&e.message)||'';
 if(/Invalid login/i.test(s))return'E-Mail oder Passwort stimmt nicht.';if(/not confirmed/i.test(s))return'Bitte zuerst den Link in der Bestätigungs-E-Mail anklicken.';
 if(/already registered/i.test(s))return'Diese E-Mail hat schon ein Konto – melde dich an.';if(/at least 6/i.test(s))return'Das Passwort braucht mindestens 6 Zeichen.';
 if(/rate limit/i.test(s))return'Zu viele Versuche – bitte in ein paar Minuten nochmal.';if(/valid email|invalid format/i.test(s))return'Bitte eine gültige E-Mail eingeben.';
 return s||'Das hat nicht geklappt, bitte nochmal versuchen.'};
if(!window.sb){msg('Die Anmeldung lädt gerade nicht (keine Verbindung). Du kannst das Tool trotzdem ohne Konto nutzen.');$('off').hidden=false}
else{
 sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY')setMode('np');else if(ev==='SIGNED_IN'&&mode!=='np'&&s)location.replace('app.html')});
 sb.auth.getSession().then(({data})=>{if(data.session&&!/type=recovery/.test(location.hash))location.replace('app.html')});
}
if(new URLSearchParams(location.search).has('neu'))setMode('up');
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)});
$('fg').addEventListener('click',()=>setMode('fg'));
$('f').addEventListener('submit',async e=>{e.preventDefault();if(!window.sb)return;
 const em=$('em').value.trim(),pw=$('pw').value,go=$('go');
 if(mode!=='np'&&!/^\S+@\S+\.\S+$/.test(em)){msg('Bitte eine gültige E-Mail eingeben.');return}
 if(mode!=='fg'&&pw.length<6){msg('Das Passwort braucht mindestens 6 Zeichen.');return}
 const xp=document.querySelector('input[name=xp]:checked')?.value;
 if(mode==='up'&&!$('ds').checked){msg('Bitte noch der Datenschutzerklärung zustimmen.');$('ds').focus();return}
 if(mode==='up'&&!xp){msg('Bitte noch auswählen, ob du so ein Tool schon kennst.');$('xp').querySelector('input').focus();return}
 go.disabled=true;
 try{
  if(mode==='in'){const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error;location.replace('app.html')}
  else if(mode==='up'){try{localStorage.setItem('sw-erfahrung',xp)}catch(er){}
   const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:pageUrl('app.html'),data:{erfahrung:xp}}});if(error)throw error;
   if(data.session)location.replace('app.html');else{msg('Fast geschafft! Wir haben dir eine E-Mail geschickt – klick auf den Link darin, dann bist du angemeldet.',1)}}
  else if(mode==='fg'){const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:pageUrl('login.html')});if(error)throw error;msg('Wenn es ein Konto mit dieser E-Mail gibt, ist der Link unterwegs. Schau auch im Spam-Ordner nach.',1)}
  else{const{error}=await sb.auth.updateUser({password:pw});if(error)throw error;msg('Passwort gespeichert – du wirst weitergeleitet …',1);setTimeout(()=>location.replace('app.html'),900)}
 }catch(er){msg(de(er))}finally{go.disabled=false}
});
}
</script>
